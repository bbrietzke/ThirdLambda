apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: thirdlambda

resources:
  - namespace.yaml
  - ../../apps/server
  # Add each app here as it is created:
  # - ../../apps/mvc
  # - ../../apps/operator

images:
  - name: thirdlambda-server
    newName: docker.io/bbrietzke/thirdlambda-server
    newTag: "0.1.0"

secretGenerator:
  - name: thirdlambda-server-secrets
    envs:
      - server.secret.env # gitignored; copy from server.secret.env.example
