apiVersion: v1
kind: Service
metadata:
  name: thirdlambda-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: thirdlambda-server
  # The management port stays off the Service: the kubelet probes pods directly, and
  # /healthz returns error details that shouldn't be reachable from the cluster network.
  ports:
    - name: grpc
      port: 3000
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
