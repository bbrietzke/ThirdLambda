apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-neutral definition of ThirdLambda.Server. It sets no namespace, image
# registry or secret values; those belong to the overlay that includes this app.

resources:
  - deployment.yaml
  - service.yaml

# Selectors are written out in the manifests and left alone here on purpose: a Deployment's
# selector is immutable, so a label added here later must not be able to reach it.
labels:
  - pairs:
      app.kubernetes.io/component: server
      app.kubernetes.io/part-of: thirdlambda
    includeTemplates: true

# Generated so that a config change gets a new name and rolls the pods.
configMapGenerator:
  - name: thirdlambda-server-config
    literals:
      # Must stay explicit: appsettings.json defaults to Sqlite, which would put the
      # data on the pod's ephemeral disk.
      - Database__Provider=SqlServer
